upstream academico_backend {
    server web-academico:8080;
    server web-academico2:8080;
}

server {
    listen 80;

    location /financeiro/ {
        proxy_pass http://web-financeiro:9501/;
    }

    location /mkt/ {
        proxy_pass http://web-mkt:3000/;
    }

    location /academico/ {
        proxy_pass http://web-academico:8080/;
    }
}
